# ============================================================
# DailySnap 官网 + 下载 + relay 反代（HTTPS 版）
# ============================================================

# HTTP → HTTPS 重定向 + ACME 验证
server {
    listen 80;
    server_name dailysnap.online www.dailysnap.online _;

    server_tokens off;
    client_max_body_size 200M;

    # Let's Encrypt 验证用（certbot webroot）
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 其余全部重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主服务
server {
    listen 443 ssl;
    http2 on;
    server_name dailysnap.online www.dailysnap.online;

    server_tokens off;
    client_max_body_size 200M;

    ssl_certificate     /etc/letsencrypt/live/dailysnap.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dailysnap.online/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ============================================================
    # 静态资源：官网 + 下载页 + .dmg
    # ============================================================

    # 根路径：官网首页
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # /index.html
    location = /index.html {
        root /usr/share/nginx/html;
    }

    # 静态资源兜底（cats/ icon/ assets/ 等官网静态文件）+ 缓存
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # 图片类静态资源：长缓存（webp/png/ico）
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # JS/CSS：长缓存（文件名带 hash）
    location ~* \.(js|css|woff2?)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # /downloads/：.dmg 安装包下载目录
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;
        add_header Content-Disposition "attachment";
    }

    # ============================================================
    # OpenAI 兼容协议反向代理 → relay
    # ============================================================

    location /v1/ {
        proxy_pass http://dailysnap-relay:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://dailysnap-relay:8000/health;
    }
}
