server {
    listen 80 default_server;
    server_name _;

    # 安全：暴露版本太招黑
    server_tokens off;

    # 上传限制（DailySnap 上传 .dmg 单文件约 60-100MB）
    client_max_body_size 200M;

    # ============================================================
    # 静态资源：下载页 + .dmg
    # ============================================================

    # 根路径：下载页
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    # /index.html（用户直接访问也能看到下载页）
    location = /index.html {
        root /usr/share/nginx/html;
    }

    # /downloads/：.dmg 安装包下载目录
    location /downloads/ {
        alias /usr/share/nginx/html/downloads/;
        autoindex off;  # 不显示目录列表（防止泄露文件名）
        add_header Content-Disposition "attachment";  # 浏览器触发下载而非打开
    }

    # ============================================================
    # OpenAI 兼容协议反向代理 → relay
    # ============================================================

    location /v1/ {
        proxy_pass http://dailysnap-relay:8000;
        proxy_http_version 1.1;

        # 透传客户端真实 IP（X-Forwarded-* 让 relay 看得到）
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应关键：不缓存、不缓冲、关闭 Connection 头
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";

        # 超时：客户端断开就停
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://dailysnap-relay:8000/health;
    }
}