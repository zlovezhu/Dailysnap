# ============================================================
# DailySnap 官网 + 下载 + relay 反代（HTTP 临时版）
# HTTPS 暂未配置，等 CloudFlare Origin CA 或 Let's Encrypt 证书申请后恢复 443 块
# ============================================================

# HTTP 临时版：直接 serve 静态
server {
    listen 80;
    server_name dailysnap.online www.dailysnap.online _;

    server_tokens off;
    client_max_body_size 200M;

    # ACME 验证用（certbot webroot）—— 申请证书时启用
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # 静态资源（直接 serve，不重定向）
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;
    }

    # /v1/ 反代 relay（中转服务）
    location /v1/ {
        proxy_pass http://dailysnap-relay:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 600s;
    }

    # 健康检查
    location /health {
        proxy_pass http://dailysnap-relay:8000/health;
    }
}

